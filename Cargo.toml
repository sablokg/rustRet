[package]
name = "rustRet"
version = "0.6.0"
edition = "2024"
license = "MIT"
authors = ["Gaurav Sablok"]
description = "mass-spectroscopy analyzer"
homepage = "https://codeberg.org/gsablok/rustRet"
repository = "https://codeberg.org/gsablok/rustRet"
keywords = ["bioinformatics","genomics"]

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
figlet-rs = "0.1.5"
rand = "0.9.2"
smartcore = { version = "0.4.7", features = ["datasets", "std_rand"] }
rayon = "1.11.0"
